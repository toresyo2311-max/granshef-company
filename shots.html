<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Shot</title>
<style>
  html,body{margin:0;background:#fff;overflow:hidden}
  #stage{position:absolute;top:0;left:0;transform-origin:top left}
  iframe{display:block;border:0;background:#fff}
</style>
</head>
<body>
<div id="stage"><iframe id="f" title="shot"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +(q.get('w') || 1440);
  const h = +(q.get('h') || 1324);
  const s = +(q.get('s') || 1);
  const hash = q.get('hash') || '';
  const f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
  f.src = './index.html' + (hash ? '#' + hash : '');
</script>
</body>
</html>
