<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>screenshot board</title>
<style>
  html,body{margin:0;background:#d8d4cc;font-family:-apple-system,"Malgun Gothic",sans-serif}
  .row{display:flex;gap:18px;padding:16px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:8px}
  .lab{font-size:13px;font-weight:700;color:#333;letter-spacing:.04em}
  iframe{border:0;background:#fff;display:block;box-shadow:0 3px 10px rgba(0,0,0,.22)}
  .d iframe{width:1440px;height:1060px}
  .m iframe{width:390px;height:844px}
</style>
</head>
<body>
<div class="row">
  <div class="col d"><div class="lab">데스크톱 1440</div><iframe id="d" title="desktop"></iframe></div>
  <div class="col m"><div class="lab">모바일 390</div><iframe id="m" title="mobile"></iframe></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var target = q.get('t') || '';
  var base = './index.html?v=20261120f';
  ['d','m'].forEach(function(id){
    var f = document.getElementById(id);
    f.addEventListener('load', function(){
      try{
        if(!target) return;
        var doc = f.contentDocument;
        var el = doc.getElementById(target);
        if(!el) return;
        var top = el.getBoundingClientRect().top + f.contentWindow.scrollY - 70;
        f.contentWindow.scrollTo(0, Math.max(0, top));
      }catch(e){}
    });
    f.src = base;
  });
})();
</script>
</body>
</html>
