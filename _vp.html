<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viewport test</title>
<style>
  html,body{margin:0;background:#cfcfcf}
  #wrap{transform-origin:top left;display:inline-block}
  iframe{border:0;display:block;background:#fff}
  #lb{position:fixed;left:8px;bottom:8px;z-index:9;background:#111;color:#fff;font:12px/1.5 monospace;padding:4px 8px;border-radius:4px}
</style>
</head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<div id="lb"></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = +p.get('w') || 390;
  var h = +p.get('h') || 900;
  var s = +p.get('s') || 1;
  var u = p.get('u') || 'index.html';
  var f = document.getElementById('f');
  f.width = w; f.height = h;
  f.src = u + (u.indexOf('?') < 0 ? '?reveal=all' : '&reveal=all');
  document.getElementById('wrap').style.transform = 'scale(' + s + ')';
  document.getElementById('lb').textContent = w + 'px @' + s + ' — ' + u;
</script>
</body>
</html>
