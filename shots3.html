<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Shot</title>
<style>
  html,body{margin:0;background:#ffffff;overflow:hidden;font:11px/1 -apple-system,sans-serif;color:#8b8377}
  #d,#m{position:absolute;top:0;border:0;background:#fff;display:block}
  #d{left:0;width:1440px;height:1000px}
  #m{left:1500px;width:390px;height:1000px;box-shadow:0 0 0 1px #e2ddd4}
  #lab{position:absolute;left:1500px;top:1010px;width:390px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<iframe id="d" title="desktop"></iframe>
<iframe id="m" title="mobile"></iframe>
<div id="lab"></div>
<script>
  const q = new URLSearchParams(location.search);
  const hash = q.get('hash') || '';
  const suffix = hash ? '#' + hash : '';
  const bust = '?v=' + Date.now();
  document.getElementById('d').src = './index.html?v=' + Date.now() + suffix;
  document.getElementById('m').src = './index.html?v=' + Date.now() + suffix;
  const y = +(q.get('y') || 0);
  if (y) {
    document.getElementById('d').addEventListener('load', () => {
      const w = document.getElementById('d').contentWindow;
      setTimeout(() => w.scrollTo(0, y), 300);
    });
  }
  document.getElementById('lab').textContent = (q.get('lab') || '') + '  ·  desktop 1440 / mobile 390';
</script>
</body>
</html>
