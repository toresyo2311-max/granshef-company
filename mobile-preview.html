<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>모바일 화면 확인용 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#b9b2a6}
  iframe{display:block;border:0;margin:0}
</style>
</head>
<body>
<iframe id="fr" title="모바일 미리보기"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var fr = document.getElementById('fr');
  var w = q.get('w') || '390', h = q.get('h') || '844', s = q.get('s') || '';
  fr.style.width = w + 'px';
  fr.style.height = h + 'px';
  fr.src = 'index.html?reveal=all&cb=' + Date.now() + (s ? '#' + s : '');
</script>
</body>
</html>
